name: OpenAPI Spec Check

on:
  pull_request:
    paths:
      - "backend/src/routes/**"
      - "backend/src/services/**"
      - "backend/src/middleware/deprecation.ts"
      - "backend/src/index.ts"
      - "backend/openapi.json"
      - "backend/package.json"
      - "docs/api-changelog.md"
  push:
    branches:
      - main

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check spec is committed
        run: |
          if [ ! -f backend/openapi.json ]; then
            echo "ERROR: backend/openapi.json is missing."
            exit 1
          fi
          echo "openapi.json present"

      - name: Validate OpenAPI 3.0 spec (strict)
        run: npx --yes @redocly/cli@1.x lint --extends=recommended backend/openapi.json

      - name: Verify openapi.json is up-to-date with code annotations
        run: |
          cd backend
          npm ci --legacy-peer-deps
          npm run openapi:generate
          if [ -n "$(git status --porcelain openapi.json)" ]; then
            echo "ERROR: openapi.json is stale or out of sync with code annotations. Run 'npm run openapi:generate' in backend directory and commit."
            git diff openapi.json
            exit 1
          fi
          echo "openapi.json is up-to-date"

      - name: Verify info.version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./backend/package.json').version")
          SPEC_VERSION=$(node -p "require('./backend/openapi.json').info.version")
          if [ "$PKG_VERSION" != "$SPEC_VERSION" ]; then
            echo "ERROR: openapi.json info.version ($SPEC_VERSION) does not match backend/package.json ($PKG_VERSION)."
            echo "Run: cd backend && npm run openapi:sync"
            exit 1
          fi
          echo "info.version matches package.json ($PKG_VERSION)"

  validate-spec-against-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Start backend server
        env:
          NODE_ENV: test
          PORT: "3001"
          RPC_URL: "https://soroban-testnet.stellar.org"
          CONTRACT_ID: "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4"
          JWT_SECRET: "ci-test-jwt-secret-at-least-16-chars" # gitleaks:allow
          WEBHOOK_SECRET: "ci-test-webhook-secret-16"
        run: |
          npm run build
          node dist/index.js &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for server to be ready (up to 30 s)
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/v1/health && break
            sleep 1
          done
        working-directory: backend

      - name: Validate spec routes exist on running server
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const http = require("http");

          const spec = JSON.parse(fs.readFileSync("backend/openapi.json", "utf8"));
          const BASE = "http://localhost:3001/api/v1";

          const SKIP_METHODS = new Set(["put", "patch", "delete"]);
          const SKIP_PATHS = new Set([
            "/collateral/{id}",
            "/collateral/{id}/appraise",
            "/collateral/{id}/restore",
            "/loan/{id}",
            "/health/{loanId}",
            "/transactions/{hash}/status",
            "/webhooks/{id}",
            "/admin/restore/collateral/{id}",
          ]);

          async function probe(method, path) {
            return new Promise((resolve) => {
              const url = `${BASE}${path}`;
              const req = http.request(url, { method: method.toUpperCase() }, (res) => {
                resolve({ method, path, status: res.statusCode });
              });
              req.on("error", () => resolve({ method, path, status: null }));
              req.end();
            });
          }

          (async () => {
            const failures = [];
            for (const [path, methods] of Object.entries(spec.paths)) {
              if (SKIP_PATHS.has(path)) continue;
              for (const method of Object.keys(methods)) {
                if (SKIP_METHODS.has(method)) continue;
                const result = await probe(method, path);
                // A reachable route returns any status except 404/405
                if (result.status === 404 || result.status === 405 || result.status === null) {
                  failures.push(`${method.toUpperCase()} ${path} → ${result.status ?? "unreachable"}`);
                } else {
                  console.log(`✓ ${method.toUpperCase()} ${path} → ${result.status}`);
                }
              }
            }
            if (failures.length > 0) {
              console.error("\nSpec routes missing from server:");
              failures.forEach((f) => console.error("  ✗ " + f));
              process.exit(1);
            }
            console.log("\nAll probed spec routes are reachable.");
          })();
          EOF

      - name: Stop backend server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  check-changelog-staleness:
    name: Changelog staleness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if openapi.json changed without updating api-changelog.md
        run: |
          # Collect the list of files changed in this PR (or the last commit on push)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse --root)"
            HEAD="HEAD"
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          SPEC_CHANGED=false
          CHANGELOG_CHANGED=false

          echo "$CHANGED" | grep -q "^backend/openapi\.json$"  && SPEC_CHANGED=true
          echo "$CHANGED" | grep -q "^docs/api-changelog\.md$" && CHANGELOG_CHANGED=true

          echo "openapi.json changed:    $SPEC_CHANGED"
          echo "api-changelog.md changed: $CHANGELOG_CHANGED"

          if [ "$SPEC_CHANGED" = "true" ] && [ "$CHANGELOG_CHANGED" = "false" ]; then
            echo ""
            echo "ERROR: backend/openapi.json was modified but docs/api-changelog.md was not updated."
            echo "Please add an entry to docs/api-changelog.md describing the API change."
            echo "See the Keep-a-Changelog format in the existing entries for guidance."
            exit 1
          fi

          echo "Changelog check passed."
